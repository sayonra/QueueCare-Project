name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: queuecare
          MYSQL_USER: queuecare
          MYSQL_PASSWORD: queuecare_ci
          MYSQL_ROOT_PASSWORD: queuecare_ci_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u queuecare -pqueuecare_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_DATABASE: queuecare
      DB_USERNAME: queuecare
      DB_PASSWORD: queuecare_ci
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: php artisan migrate --force
      - run: php artisan test --compact
      - run: vendor/bin/pint --test --format agent

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/mobile
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run typecheck:mobile
      - run: npm run build:web
