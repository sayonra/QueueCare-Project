services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: queuecare
      MYSQL_USER: queuecare
      MYSQL_PASSWORD: ${QUEUECARE_DB_PASSWORD:?Set QUEUECARE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${QUEUECARE_DB_ROOT_PASSWORD:?Set QUEUECARE_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  mysql_data:
